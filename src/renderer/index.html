<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Keep this CSP meta tag first in <head>. In dev, Vite injects the react-refresh
      preamble before the CSP meta tag, so the order matters.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StorageIQ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
