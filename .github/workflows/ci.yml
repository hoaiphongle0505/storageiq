name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npx electron-vite build

      - name: End-to-end tests
        run: npx playwright test

      - name: Package installer
        run: npx electron-builder --win --x64 --publish never

      - name: Packaged app self-test (koffi from app.asar.unpacked, scanner process)
        run: npm run test:packaged

      - name: Collect metrics (report only)
        continue-on-error: true
        env:
          STORAGEIQ_METRICS: '1'
        run: npx playwright test e2e/metrics.spec.ts

      - name: Report metrics (report only)
        continue-on-error: true
        run: npm run metrics

      - uses: actions/upload-artifact@v4
        with:
          name: storageiq-installer
          path: release/*/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
