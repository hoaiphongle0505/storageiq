name: Release

# Pushing a tag vX.Y.Z (stable) or vX.Y.Z-beta.N (pre-release) builds the installer and publishes
# it to GitHub Releases, where the installed app finds updates. See docs/RELEASING.md.
#
# Two jobs: `build` runs the repository's code with read-only access and uploads the release
# files; `publish` has write access, runs none of the repository's code and only uploads those
# files. The release is created as a draft, gets all its files, and is published last, so nobody
# sees a release without `latest.yml`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned by commit SHA (the comment names the version).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npx electron-vite build

      - name: Package installer
        run: npx electron-builder --win --x64 --publish never

      - name: Check the packaged app
        run: npm run test:packaged

      - name: Check release files
        run: |
          dir="release/$VERSION"
          for file in "StorageIQ-Setup-$VERSION-x64.exe" "StorageIQ-Setup-$VERSION-x64.exe.blockmap" latest.yml; do
            if [ ! -f "$dir/$file" ]; then
              echo "Missing $dir/$file" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 7
          path: |
            release/${{ steps.version.outputs.version }}/StorageIQ-Setup-${{ steps.version.outputs.version }}-x64.exe
            release/${{ steps.version.outputs.version }}/StorageIQ-Setup-${{ steps.version.outputs.version }}-x64.exe.blockmap
            release/${{ steps.version.outputs.version }}/latest.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files

      - name: Publish to GitHub Releases
        run: |
          files=(release-files/*)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "Expected 3 release files, found ${#files[@]}" >&2
            exit 1
          fi
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --title "$TAG" --generate-notes "${flags[@]}"
          fi
          # Every file is attached: only now does the release become visible to installed apps.
          gh release edit "$TAG" --draft=false
