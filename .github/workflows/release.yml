name: Release

# Pushing a tag vX.Y.Z (stable) or vX.Y.Z-beta.N (pre-release) builds the installer and publishes
# it to GitHub Releases, where the installed app finds updates. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npx electron-vite build

      - name: Package installer
        run: npx electron-builder --win --x64 --publish never

      - name: Check the packaged app
        run: npm run test:packaged

      - name: Check release files
        run: |
          dir="release/$VERSION"
          for file in "StorageIQ-Setup-$VERSION-x64.exe" "StorageIQ-Setup-$VERSION-x64.exe.blockmap" latest.yml; do
            if [ ! -f "$dir/$file" ]; then
              echo "Missing $dir/$file" >&2
              exit 1
            fi
          done

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dir="release/$VERSION"
          files=("$dir/StorageIQ-Setup-$VERSION-x64.exe" "$dir/StorageIQ-Setup-$VERSION-x64.exe.blockmap" "$dir/latest.yml")
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes "${flags[@]}"
          fi
